name: Build and publish to do-actions-runner

on:
  push:
    branches:
      - master

env:
  REPOSITORY_NAME: do-actions-runner

jobs:
  build:
    runs-on:
      # docs: https://docs.aws.amazon.com/codebuild/latest/userguide/sample-github-action-runners-update-yaml.images.html
      - default-small-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ vars.BW_AWS_DEV_ACCOUNT_ID }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=381492305859.dkr.ecr.eu-west-1.amazonaws.com/docker-hub/moby/buildkit:master

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
      
      - name: Build packages/docker
        run: |
          npm install
          npm run bootstrap
          npm run build --prefix packages/docker

      - name: Get runner version
        id: runner_version
        shell: bash
        run: |
          version=$(grep '^ARG RUNNER_VERSION=' Dockerfile | cut -d= -f2)
          echo "action_runner_tag=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Building actions runner: ${{ vars.BW_AWS_DEV_ECR_REGISTRY }}/${{ env.REPOSITORY_NAME }}:${version}-${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.BW_AWS_DEV_ECR_REGISTRY }}/${{ env.REPOSITORY_NAME }}:${{ steps.runner_version.outputs.action_runner_tag }}
          context: .